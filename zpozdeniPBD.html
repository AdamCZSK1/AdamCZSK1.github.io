<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Záznam zpoždění učitelů</title>
    <style>
        body { font-family: sans-serif; max-width: 800px; margin: 2rem auto; padding: 0 1rem; color: #333; }
        .form-group { margin-bottom: 1rem; }
        label { display: block; font-weight: bold; margin-bottom: 0.3rem; }
        input, select { padding: 0.5rem; width: 100%; max-width: 400px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 0.6rem 1rem; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
        .btn-submit { background-color: #0056b3; color: white; }
        .btn-submit:hover { background-color: #004494; }
        .btn-submit:disabled { background-color: #999; cursor: not-allowed; }
        #statusMessage { margin-top: 1rem; font-weight: bold; display: none; }
        .success { color: #28a745; }
        .error { color: #dc3545; }
        
        /* Styly pro tabulku výpisů */
        #loadingMsg { margin-top: 2rem; font-style: italic; color: #666; }
        table { width: 100%; border-collapse: collapse; margin-top: 1rem; display: none; }
        th, td { border: 1px solid #ddd; padding: 0.5rem; text-align: left; }
        th { background-color: #f4f4f4; }
    </style>
</head>
<body>

    <h2>Záznam zpoždění učitelů</h2>

    <form id="delayForm">
        <div class="form-group">
            <label for="date">Datum:</label>
            <input type="date" id="date" name="date" required>
        </div>

        <div class="form-group">
            <label for="teacher">Učitel:</label>
            <select id="teacher" name="teacher" required>
                <option value="">-- Vyberte učitele ze seznamu --</option>
                <option value="Alena Honková">Alena Honková</option>
                <option value="Anna Hýbnerová">Anna Hýbnerová</option>
                <option value="Blanka Felegy">Blanka Felegy</option>
                <option value="Daniela Bártíková">Daniela Bártíková</option>
                <option value="František Váňa">František Váňa</option>
                <option value="Ilona Prokopcová">Ilona Prokopcová</option>
                <option value="Jan Buček">Jan Buček</option>
                <option value="Jana Jindřichová">Jana Jindřichová</option>
                <option value="Jindřich Korytář">Jindřich Korytář</option>
                <option value="Lenka Petrášová">Lenka Petrášová</option>
                <option value="Lucie Auinger">Lucie Auinger</option>
                <option value="Lukáš Procházka">Lukáš Procházka</option>
                <option value="Marcela Peroutková Kubíková">Marcela Peroutková Kubíková</option>
                <option value="Martina Prošková">Martina Prošková</option>
                <option value="Miroslava Chocholová">Miroslava Chocholová</option>
                <option value="Ondřej Čech">Ondřej Čech</option>
                <option value="Pavla Budilová (asistentka)">Pavla Budilová (asistentka)</option>
                <option value="Pavlína Lindová">Pavlína Lindová</option>
                <option value="Petr Peleška">Petr Peleška</option>
                <option value="Radana Jarošová">Radana Jarošová</option>
                <option value="Soňa Krausová">Soňa Krausová</option>
            </select>
        </div>

        <div class="form-group">
            <label for="subject">Předmět:</label>
            <input type="text" id="subject" name="subject" placeholder="Např. Matematika, Čeština..." required>
        </div>

        <div class="form-group">
            <label for="lesson">Číslo hodiny (0-9):</label>
            <input type="number" id="lesson" name="lesson" min="0" max="9" required>
        </div>

        <div class="form-group">
            <label for="delay">Zpoždění (v minutách):</label>
            <input type="number" id="delay" name="delay" min="0" required>
        </div>

        <button type="submit" id="submitBtn" class="btn-submit">Odeslat</button>
    </form>

    <div id="statusMessage"></div>

    <hr style="margin: 2rem 0; border: 0; border-top: 1px solid #ccc;">

    <h3>Dosavadní záznamy</h3>
    <div id="loadingMsg">Načítám data...</div>
    
    <table id="dataTable">
        <thead>
            <tr>
                <th>Datum</th>
                <th>Učitel</th>
                <th>Předmět</th>
                <th>Hodina</th>
                <th>Zpoždění (min)</th>
            </tr>
        </thead>
        <tbody id="tableBody">
            </tbody>
    </table>

    <script>
        // Nastavení dnešního data jako výchozího
        document.getElementById('date').valueAsDate = new Date();

        // TADY NEZAPOMEŇ VLOŽIT SVOJI URL ADRESU!
        const scriptURL = 'https://script.google.com/macros/s/AKfycbzxSy4gY0uCd3lc0mt81dpk_2UnE96Hjk9dRCTaKPw4WEjFCw2TLcSkPOJxY5kKCITObw/exec';

        const form = document.getElementById('delayForm');
        const submitBtn = document.getElementById('submitBtn');
        const statusMessage = document.getElementById('statusMessage');
        const tableBody = document.getElementById('tableBody');
        const dataTable = document.getElementById('dataTable');
        const loadingMsg = document.getElementById('loadingMsg');

        // Funkce pro načtení dat z Google Tabulky
        function loadData() {
            fetch(scriptURL)
                .then(response => response.json())
                .then(data => {
                    tableBody.innerHTML = ''; // Vyčištění předchozích dat
                    
                    if(data.length === 0) {
                        loadingMsg.innerText = 'Zatím žádné záznamy.';
                        dataTable.style.display = 'none';
                        return;
                    }

                    data.forEach(r => {
                        const row = document.createElement('tr');
                        row.innerHTML = `<td>${r.date}</td><td>${r.teacher}</td><td>${r.subject}</td><td>${r.lesson}</td><td>${r.delay}</td>`;
                        tableBody.appendChild(row);
                    });

                    loadingMsg.style.display = 'none';
                    dataTable.style.display = 'table';
                })
                .catch(error => {
                    console.error('Chyba:', error);
                    loadingMsg.innerText = 'Chyba při načítání dat.';
                    loadingMsg.style.color = 'red';
                });
        }

        // Načtení dat hned při otevření stránky
        loadData();

        // Odesílání formuláře
        form.addEventListener('submit', e => {
            e.preventDefault();
            
            submitBtn.disabled = true;
            submitBtn.innerText = 'Odesílám...';
            statusMessage.style.display = 'block';
            statusMessage.className = '';
            statusMessage.innerText = '';

            const formData = new FormData(form);

            fetch(scriptURL, { method: 'POST', body: formData })
                .then(response => {
                    statusMessage.innerText = 'Záznam byl úspěšně uložen!';
                    statusMessage.className = 'success';
                    
                    // Vyčištění formuláře (datum necháme)
                    document.getElementById('teacher').value = '';
                    document.getElementById('subject').value = '';
                    document.getElementById('lesson').value = '';
                    document.getElementById('delay').value = '';
                    
                    submitBtn.disabled = false;
                    submitBtn.innerText = 'Odeslat';
                    
                    setTimeout(() => { statusMessage.style.display = 'none'; }, 4000);

                    // Aby se rovnou ukázal nový záznam i v tabulce dole, znovu zavoláme funkci načítání
                    loadingMsg.style.display = 'block';
                    loadingMsg.innerText = 'Aktualizuji data...';
                    loadData();
                })
                .catch(error => {
                    statusMessage.innerText = 'Chyba při odesílání: ' + error.message;
                    statusMessage.className = 'error';
                    submitBtn.disabled = false;
                    submitBtn.innerText = 'Odeslat';
                });
        });
    </script>
</body>
</html>
